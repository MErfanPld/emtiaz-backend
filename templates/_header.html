{% load static %}
<link rel="icon" href="{% static 'logo.svg' %}" type="image/svg+xml" />
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="{% static 'css/index.css' %}" />
<link rel="stylesheet" href="{% static 'responsive.css' %}" />
<script src="{% static 'js/tailwind-config.js' %}"></script>
<style>
  html { overflow-x: hidden; }
  body { overflow-x: hidden; max-width: 100vw; }
  html[dir="ltr"] body { font-family: Inter, Vazirmatn, system-ui, sans-serif; }

  /* Mobile drawer: closed by default */
  #mobile-menu-backdrop {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .2s ease, visibility .2s ease;
  }
  #mobile-menu-backdrop.is-open {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  #mobile-menu-panel {
    transition: transform .25s ease;
  }
  html[dir="rtl"] #mobile-menu-panel { transform: translateX(105%); }
  html[dir="ltr"] #mobile-menu-panel { transform: translateX(-105%); }
  html[dir="rtl"] #mobile-menu-panel.is-open,
  html[dir="ltr"] #mobile-menu-panel.is-open { transform: translateX(0); }

  @media (max-width: 1023px) {
    .container-pad { padding-left: 1rem; padding-right: 1rem; }
  }
  img, video { max-width: 100%; height: auto; }
</style>
