{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold mb-6">تغییر رمز عبور</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full h-11 rounded-lg bg-primary text-white text-sm font-medium">تغییر رمز</button>
  </form>
</div>
{% endblock %}
