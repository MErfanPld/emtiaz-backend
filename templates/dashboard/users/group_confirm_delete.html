{% extends "dashboard/base_dashboard.html" %}
{% block title %}حذف گروه{% endblock %}
{% block breadcrumb %}<a href="{% url 'dashboard:group_list' %}">گروه‌ها</a> / حذف{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border p-8 max-w-md mx-auto text-center shadow-sm">
  <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h1 class="text-xl font-bold mb-2">حذف گروه «{{ object.name }}»</h1>
  <p class="text-sm text-on-surface-variant mb-6">کاربران از این گروه خارج می‌شوند؛ خود کاربران حذف نمی‌شوند.</p>
  <form method="post" class="flex gap-3 justify-center">{% csrf_token %}
    <button type="submit" class="px-5 py-2.5 rounded-lg bg-red-600 text-white font-bold text-sm">حذف</button>
    <a href="{% url 'dashboard:group_list' %}" class="px-5 py-2.5 rounded-lg border text-sm">انصراف</a>
  </form>
</div>
{% endblock %}
