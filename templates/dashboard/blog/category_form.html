{% extends "dashboard/base_dashboard.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<form method="post" class="bg-white rounded-xl border p-6 max-w-lg space-y-4">{% csrf_token %}
  <div><label class="block text-xs font-semibold mb-1">نام</label>{{ form.name }}</div>
  <div><label class="block text-xs font-semibold mb-1">اسلاگ</label>{{ form.slug }}</div>
  <div><label class="block text-xs font-semibold mb-1">ترتیب</label>{{ form.sort_order }}</div>
  <label class="inline-flex items-center gap-2 text-sm">{{ form.is_active }} فعال</label>
  <div class="flex gap-3 pt-2"><button class="px-5 py-2 rounded-lg bg-primary text-white text-sm font-bold">ذخیره</button><a href="{% url 'dashboard:blog_category_list' %}" class="px-5 py-2 rounded-lg border text-sm">انصراف</a></div>
</form>
{% endblock %}
