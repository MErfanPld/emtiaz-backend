{% extends "dashboard/base_dashboard.html" %}
{% block title %}حذف ملک{% endblock %}
{% block breadcrumb %}<a href="{% url 'dashboard:property_list' %}">املاک</a> / <span class="text-primary font-bold">حذف</span>{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border shadow-sm p-8 max-w-md mx-auto text-center">
  <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h1 class="text-xl font-bold text-primary mb-2">حذف ملک</h1>
  <p class="text-sm text-on-surface-variant mb-6">آیا از حذف «{{ object.title }}» ({{ object.code }}) مطمئن هستید؟</p>
  <form method="post" class="flex gap-3 justify-center">
    {% csrf_token %}
    <button type="submit" class="px-5 py-2.5 rounded-lg bg-red-600 text-white font-bold text-sm"><i class="fa-solid fa-trash ml-1"></i> حذف قطعی</button>
    <a href="{% url 'dashboard:property_list' %}" class="px-5 py-2.5 rounded-lg border text-sm font-semibold">انصراف</a>
  </form>
</div>
{% endblock %}
