{% load static %}


<header
      class="bg-surface/95 dark:bg-inverse-surface/95 backdrop-blur-md text-primary dark:text-inverse-primary docked full-width top-0 sticky z-50 shadow-sm dark:shadow-none border-b border-outline-variant/40 dark:border-outline/30"
    >
      <div
        class="w-full max-w-[1320px] mx-auto px-6 md:px-12 flex items-center justify-between min-h-[72px] md:min-h-[80px] py-2 rtl"
      >
        <!-- Right: Brand Identity & Monogram -->
        <div class="flex items-center gap-4">
          <a
            class="flex items-center gap-3 group transition-transform duration-200 active:scale-95 shrink-0"
            href="./index.html"
          >
            <img
              src="{% static './logo.svg' %}"
              alt="املاک امتیاز | EMTIAZ Real Estate"
              class="h-14 md:h-16 w-auto object-contain"
              width="64"
              height="64"
            />
          </a>
        </div>
        <!-- Center: Navigation Links -->
        <nav class="hidden lg:flex items-center gap-8">
          <a
            class="text-primary dark:text-inverse-primary font-semibold border-b-2 border-secondary pb-1 text-label-lg font-label-lg transition-colors duration-200"
            href="./index.html"
            >صفحه اصلی</a
          >
          <a
            class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors duration-200 text-label-lg font-label-lg"
            href="./about.html"
            >معرفی مجموعه</a
          >
          <a
            class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors duration-200 text-label-lg font-label-lg"
            href="./info.html"
            >دفاتر املاک</a
          >
          <a
            class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors duration-200 text-label-lg font-label-lg"
            href="./homes.html"
            >املاک</a
          >
          <a
            class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors duration-200 text-label-lg font-label-lg"
            href="./blogs.html"
            >مقالات</a
          >
          <a
            class="text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-inverse-primary transition-colors duration-200 text-label-lg font-label-lg"
            href="#contact"
            >تماس با ما</a
          >
        </nav>
        <!-- Left: Contact Badge & Trailing Actions -->
        <div class="flex items-center gap-4">
          <button
            type="button"
            id="mobile-menu-btn"
            class="lg:hidden inline-flex items-center justify-center w-11 h-11 rounded-lg border border-outline-variant/50 text-primary hover:bg-surface-container transition-colors"
            aria-label="باز کردن منو"
            aria-expanded="false"
            aria-controls="mobile-menu-panel"
          >
            <span
              class="material-symbols-outlined text-[26px]"
              id="mobile-menu-icon"
              >menu</span
            >
          </button>

          <div
            class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container-high text-primary border border-outline-variant/30"
          >
            <span
              class="material-symbols-outlined text-secondary"
              data-icon="call"
              style="font-size: 18px"
              >call</span
            >
            <span
              class="text-label-md font-label-md tracking-wider font-semibold"
              >۰۲۱-۲۲۰۰۰۰۰۰</span
            >
          </div>
          <a
            class="px-5 py-2.5 rounded-lg bg-primary-container text-on-primary hover:bg-[#8B1E2A] transition-all duration-200 ease-in-out active:scale-95 text-label-lg font-label-lg shadow-sm flex items-center gap-2 border border-secondary/30"
            href="#contact"
          >
            <span
              class="material-symbols-outlined text-white text-sm"
              data-icon="support_agent"
              >support_agent</span
            >
            <span class="">تماس با مجموعه</span>
          </a>
        </div>
      </div>
    </header>
    <div
      id="mobile-menu-backdrop"
      class="fixed inset-0 z-[90] bg-black/45 lg:hidden"
      aria-hidden="true"
    ></div>
    <div
      id="mobile-menu-panel"
      class="fixed top-0 right-0 z-[100] h-full w-[min(100%,300px)] bg-surface shadow-2xl lg:hidden flex flex-col"
      role="dialog"
      aria-modal="true"
      aria-label="منوی اصلی"
    >
      <div
        class="flex items-center justify-between p-4 border-b border-outline-variant/40"
      >
        <a href="index.html" class="flex items-center gap-2"
          ><img
            src="{% static './logo.svg' %}"
            alt="املاک امتیاز"
            class="h-10 w-auto object-contain"
            width="40"
            height="40"
        /></a>
        <button
          type="button"
          id="mobile-menu-close"
          class="inline-flex items-center justify-center w-10 h-10 rounded-lg text-primary hover:bg-surface-container"
          aria-label="بستن منو"
        >
          <span class="material-symbols-outlined text-[24px]">close</span>
        </button>
      </div>
      <nav class="flex-1 overflow-y-auto p-4 space-y-1">
        <a
          class="block py-3 px-2 text-label-lg font-label-lg text-on-surface border-b border-outline-variant/30 hover:text-primary transition-colors"
          href="index.html"
          >صفحه اصلی</a
        ><a
          class="block py-3 px-2 text-label-lg font-label-lg text-on-surface border-b border-outline-variant/30 hover:text-primary transition-colors"
          href="info.html"
          >معرفی مجموعه</a
        ><a
          class="block py-3 px-2 text-label-lg font-label-lg text-on-surface border-b border-outline-variant/30 hover:text-primary transition-colors"
          href="homes.html"
          >املاک</a
        ><a
          class="block py-3 px-2 text-label-lg font-label-lg text-on-surface border-b border-outline-variant/30 hover:text-primary transition-colors"
          href="blogs.html"
          >مقالات</a
        ><a
          class="block py-3 px-2 text-label-lg font-label-lg text-on-surface border-b border-outline-variant/30 hover:text-primary transition-colors"
          href="about.html"
          >تماس با ما</a
        >
      </nav>
      <div class="p-4 border-t border-outline-variant/40 space-y-3">
        <a
          href="tel:02122008890"
          class="flex items-center justify-center gap-2 w-full py-3 rounded-lg bg-surface-container text-primary text-label-md font-semibold border border-outline-variant/40"
          ><span class="material-symbols-outlined text-[20px]">call</span
          ><span dir="ltr">۰۲۱-۲۲۰۰۸۸۹۰</span></a
        >
        <a
          href="about.html"
          class="flex items-center justify-center gap-2 w-full py-3 rounded-lg bg-primary text-white text-label-md font-semibold"
          ><span class="material-symbols-outlined text-[20px]"
            >support_agent</span
          ><span>تماس با مجموعه</span></a
        >
      </div>
    </div>
